<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>WARP Proxi - WML Converter</title>
  <style type="text/css">
    /* IE6+ Compatible CSS */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
      color: #333333;
    }
    .wrapper {
      width: 500px;
      margin: 40px auto;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      padding: 25px;
      text-align: center;
    }
    h1 {
      color: #005588;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #555555;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #333333;
      margin-bottom: 8px;
      text-align: left;
    }
    input[type="text"] {
      width: 95%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #cccccc;
      margin-bottom: 15px;
    }
    .btn-submit {
      display: inline-block;
      background-color: #005588;
      color: #ffffff;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid #003366;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #003366;
    }
    .hint {
      font-size: 12px;
      color: #777777;
      margin-top: 20px;
    }
  </style>

  <script type="text/javascript">
    function validateForm() {
      var el = document.getElementById('wml_url');
      if (!el) { return true; }
      var val = el.value.replace(/^\s+|\s+$/g, '');
      if (val.length === 0) {
        try { alert('Please enter a URL or domain before submitting.'); } catch(e) {}
        el.focus();
        return false;
      }
      return true;
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <h1>Warp Proxi</h1>
    <p>Browse WAP/WML websites from any web browser.</p>

    <form action="/wml_to_html" method="get" accept-charset="UTF-8" onsubmit="return validateForm();">
      <label for="wml_url">Enter WML URL or Domain:</label>
      <input type="text" id="wml_url" name="wml_url" value="" placeholder="e.g. wapbrowse.com/index.wml" />
      <br />
      <input type="submit" value="Convert &raquo;" class="btn-submit" />
    </form>
  </div>
</body>
</html>

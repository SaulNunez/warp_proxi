<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>WML Browser - WARP Proxi</title>
  <style type="text/css">
    /* IE6+ Compatible CSS */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
      color: #333333;
    }
    .wrapper {
      width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      padding: 15px;
    }
    .header {
      border-bottom: 2px solid #005588;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #005588;
    }
    .header a {
      font-size: 12px;
      color: #005588;
      text-decoration: underline;
    }
    .card {
      display: none;
    }
    .card-active {
      display: block;
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
      background-color: #e6f2ff;
      padding: 6px 10px;
      margin-top: 0;
      margin-bottom: 10px;
      border-left: 4px solid #005588;
    }
    .card-content {
      font-size: 14px;
      line-height: 1.4;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
    }
    table, th, td {
      border: 1px solid #bbbbbb;
    }
    td {
      padding: 5px;
    }
    .wml-do-btn {
      background-color: #005588;
      color: #ffffff;
      border: 1px solid #003366;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      margin: 4px 2px;
    }
    a.wml-action-go, a.wml-action-prev, a.wml-action-refresh {
      display: inline-block;
      background-color: #eeeeee;
      border: 1px solid #aaaaaa;
      color: #333333;
      padding: 2px 8px;
      text-decoration: none;
      font-size: 12px;
      margin-left: 4px;
    }
    fieldset {
      border: 1px solid #cccccc;
      padding: 10px;
      margin: 10px 0;
    }
    legend {
      font-weight: bold;
    }
  </style>

  <script type="text/javascript">
    // IE6+ Compatible JavaScript for WML Navigation, Input Variables & Postfield String Interpolation
    
    var currentWmlUrl = "{{ current_wml_url | safe }}";
    var wmlVariables = {};

    function collectInputVariables(containerElem) {
      if (!containerElem) return;
      var inputs = containerElem.getElementsByTagName('input');
      for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        if (inp.name) {
          wmlVariables[inp.name] = inp.value || '';
        }
      }
      var selects = containerElem.getElementsByTagName('select');
      for (var s = 0; s < selects.length; s++) {
        var sel = selects[s];
        if (sel.name) {
          wmlVariables[sel.name] = sel.value || '';
        }
      }
    }

    function interpolateValue(rawVal) {
      if (!rawVal) return '';
      return rawVal.replace(/\$\(([^)]+)\)|\$([a-zA-Z0-9_]+)/g, function(match, p1, p2) {
        var varName = p1 || p2;
        return wmlVariables[varName] !== undefined ? wmlVariables[varName] : '';
      });
    }

    function extractWmlUrlFromProxy(proxyHref) {
      if (!proxyHref) return '';
      var idx = proxyHref.indexOf('wml_url=');
      if (idx < 0) return '';
      var paramVal = proxyHref.substring(idx + 8);
      var ampIdx = paramVal.indexOf('&');
      if (ampIdx >= 0) {
        paramVal = paramVal.substring(0, ampIdx);
      }
      try {
        return decodeURIComponent(paramVal);
      } catch (e) {
        return paramVal;
      }
    }

    function resolveAbsoluteUrl(base, relative) {
      if (!relative) return base;
      if (relative.indexOf('://') >= 0 || relative.indexOf('//') === 0) return relative;
      if (relative.indexOf('#') === 0) return relative;

      var scheme = 'http://';
      var schemeIdx = base.indexOf('://');
      if (schemeIdx >= 0) {
        scheme = base.substring(0, schemeIdx + 3);
        base = base.substring(schemeIdx + 3);
      }

      var qIdx = base.indexOf('?');
      if (qIdx >= 0) {
        base = base.substring(0, qIdx);
      }

      var host = base;
      var path = '/';
      var slashIdx = base.indexOf('/');
      if (slashIdx >= 0) {
        host = base.substring(0, slashIdx);
        path = base.substring(slashIdx);
      }

      if (relative.indexOf('/') === 0) {
        return scheme + host + relative;
      }

      var relQuery = '';
      var relQIdx = relative.indexOf('?');
      if (relQIdx >= 0) {
        relQuery = relative.substring(relQIdx);
        relative = relative.substring(0, relQIdx);
      }

      var dirPath = '/';
      var lastSlash = path.lastIndexOf('/');
      if (lastSlash >= 0) {
        dirPath = path.substring(0, lastSlash + 1);
      }

      var fullPath = dirPath + relative;
      var parts = fullPath.split('/');
      var stack = [];

      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p === '' || p === '.') {
          continue;
        } else if (p === '..') {
          if (stack.length > 0) {
            stack.pop();
          }
        } else {
          stack.push(p);
        }
      }

      return scheme + host + '/' + stack.join('/') + relQuery;
    }

    function resolveProxyUrl(linkElem) {
      var hrefAttr = linkElem.getAttribute('href') || '';
      var rawHref = linkElem.getAttribute('data-raw-href') || hrefAttr || '';
      var postfieldsStr = linkElem.getAttribute('data-postfields') || '';

      if (!hrefAttr && !rawHref) return '#';

      var absoluteTargetUrl = '';

      // First check if the rendered href is already a complete proxy URL containing an absolute wml_url
      if (hrefAttr.indexOf('wml_url=') >= 0) {
        var extracted = extractWmlUrlFromProxy(hrefAttr);
        if (extracted && (extracted.indexOf('http://') === 0 || extracted.indexOf('https://') === 0)) {
          absoluteTargetUrl = extracted;
        }
      }

      // If not resolved yet, check rawHref or fall back to resolving against currentWmlUrl
      if (!absoluteTargetUrl) {
        if (rawHref.indexOf('wml_url=') >= 0) {
          absoluteTargetUrl = extractWmlUrlFromProxy(rawHref);
        } else {
          absoluteTargetUrl = resolveAbsoluteUrl(currentWmlUrl, rawHref);
        }
      }

      if (!absoluteTargetUrl) {
        absoluteTargetUrl = resolveAbsoluteUrl(currentWmlUrl, rawHref);
      }

      var queryParams = [];
      if (postfieldsStr) {
        var fields = postfieldsStr.split(';');
        for (var i = 0; i < fields.length; i++) {
          var parts = fields[i].split('=');
          if (parts.length >= 2) {
            var pName = parts[0];
            var pRawVal = parts.slice(1).join('=');
            var interpolatedVal = interpolateValue(pRawVal);
            queryParams.push(encodeURIComponent(pName) + '=' + encodeURIComponent(interpolatedVal));
          }
        }
      }

      var finalTargetUrl = absoluteTargetUrl;
      if (queryParams.length > 0) {
        var sep = finalTargetUrl.indexOf('?') >= 0 ? '&' : '?';
        finalTargetUrl = finalTargetUrl + sep + queryParams.join('&');
      }

      return '/wml_to_html?wml_url=' + encodeURIComponent(finalTargetUrl);
    }

    function bindDynamicLinks(cardElem) {
      var links = cardElem.getElementsByTagName('a');
      for (var i = 0; i < links.length; i++) {
        (function(link) {
          var rawHref = link.getAttribute('data-raw-href') || link.getAttribute('href');

          link.onclick = function() {
            collectInputVariables(cardElem);
            if (rawHref && rawHref.indexOf('javascript:') !== 0 && rawHref.indexOf('#') !== 0) {
              var finalProxyUrl = resolveProxyUrl(link);
              window.location.href = finalProxyUrl;
              return false;
            }
          };
        })(links[i]);
      }

      var buttons = cardElem.getElementsByTagName('button');
      for (var b = 0; b < buttons.length; b++) {
        (function(btn) {
          btn.onclick = function() {
            collectInputVariables(cardElem);
            var innerLink = btn.getElementsByTagName('a')[0];
            if (innerLink) {
              innerLink.click();
            }
          };
        })(buttons[b]);
      }
    }

    function showCard(cardId) {
      var divs = document.getElementsByTagName('div');
      var firstCardId = '';
      
      for (var i = 0; i < divs.length; i++) {
        var className = divs[i].className || '';
        if (className.indexOf('card ') === 0 || className === 'card' || className.indexOf('card-active') >= 0) {
          if (!firstCardId) {
            firstCardId = divs[i].id;
          }
          divs[i].className = 'card';
        }
      }

      var targetId = cardId || firstCardId;
      var targetCard = document.getElementById(targetId);
      if (targetCard) {
        targetCard.className = 'card card-active';
        bindDynamicLinks(targetCard);
        handleCardTimer(targetCard);
      }
    }

    function handleCardTimer(cardElem) {
      var inputs = cardElem.getElementsByTagName('input');
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].className === 'wml-timer') {
          var val = parseInt(inputs[i].value, 10);
          if (!isNaN(val) && val > 0) {
            var ms = val * 100;
            setTimeout(function() {
              var onevents = cardElem.getElementsByTagName('div');
              for (var j = 0; j < onevents.length; j++) {
                if (onevents[j].className.indexOf('wml-onevent-ontimer') >= 0) {
                  var links = onevents[j].getElementsByTagName('a');
                  if (links.length > 0) {
                    links[0].click();
                  }
                }
              }
            }, ms);
          }
        }
      }
    }

    function startHashPoll() {
      var currentHash = '';
      setInterval(function() {
        var rawHash = location.hash ? location.hash.substring(1) : '';
        if (rawHash !== currentHash) {
          currentHash = rawHash;
          showCard(currentHash);
        }
      }, 150);
    }

    window.onload = function() {
      startHashPoll();
      var initialCard = location.hash ? location.hash.substring(1) : '';
      showCard(initialCard);
    };
  </script>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <a href="/">&laquo; Back to WML Proxi Home</a>
      <h1>WML Document</h1>
    </div>

    {% for card in document.cards %}
    <div id="{{ card.id }}" class="card">
      {% if card.title %}
      <div class="card-title">{{ card.title }}</div>
      {% endif %}
      {{ card.contentsHtmlText | safe }}
    </div>
    {% endfor %}
  </div>
</body>
</html>
